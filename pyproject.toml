[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "goflight-team-memory"
version = "0.3.0"
description = "A shared Markdown team memory for GoFlight"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "python-dotenv>=1,<2",
    "rich>=13,<15",
    "openai>=2,<3",
]

[project.scripts]
goflight-memory = "goflight_memory.main:main"

[tool.setuptools.packages.find]
where = ["src"]
